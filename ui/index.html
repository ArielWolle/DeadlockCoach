<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Deadlock Coach</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #14161a; color: #e6e6e6; margin: 2rem; }
    .pill { display: inline-block; padding: .2rem .7rem; border-radius: 1rem; background: #2d6cdf; }
  </style>
</head>
<body>
  <h1>Deadlock Coach</h1>
  <p>Running as: <span class="pill" id="role">...</span></p>
  <p id="link">link: idle</p>
  <p id="meta"></p>
  <p><input id="txt" value="Mid boss spawns in 30 seconds" size="40"> <button onclick="window.__TAURI__.core.invoke('say',{text:document.getElementById('txt').value}).catch(e=>alert(e))">Speak on gaming PC</button></p>
  <img id="frame" style="max-width:100%" />
  <script>
    const ev = window.__TAURI__.event;
    ev.listen("link", e => document.getElementById("link").textContent = "link: " + e.payload);
    ev.listen("frame", e => {
      document.getElementById("frame").src = e.payload.src;
      const m = e.payload.meta;
      document.getElementById("meta").textContent = `${m.width}x${m.height} @${m.dpi_scale}x, t=${m.timestamp_ms}`;
    });
  </script>
  <script>
    window.__TAURI__.core.invoke("get_role").then(r => {
      document.getElementById("role").textContent = r;
    });
  </script>
</body>
</html>
