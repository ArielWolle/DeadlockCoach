[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/transport", "crates/agent", "crates/audio", "crates/engine", "crates/brain", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["arielwolle <arielwolle@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"



